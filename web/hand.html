<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171c18" />
    <title>The second wake · Seventh Tide</title>
    <link rel="stylesheet" href="./hand.css" />
  </head>
  <body>
    <header class="mast">
      <a href="./">Seventh Tide</a>
      <span>Equipment study</span>
    </header>
    <main class="board">
      <section class="forecast" aria-labelledby="tide-title">
        <p class="kicker">Tide I of VII</p>
        <h1 id="tide-title">The second wake</h1>
        <p>Another wake follows your own.</p>
      </section>
      <aside class="log" aria-labelledby="log-title">
        <h2 id="log-title">Ship’s log</h2>
        <dl>
          <div>
            <dt>Hull</dt>
            <dd id="hull"></dd>
          </div>
          <div>
            <dt>Brace</dt>
            <dd id="brace"></dd>
          </div>
        </dl>
        <table class="crew-totals" aria-label="Crew condition">
          <thead>
            <tr>
              <th scope="col">Crew</th>
              <th scope="col">Cold</th>
              <th scope="col">Rations</th>
            </tr>
          </thead>
          <tbody id="crew-totals"></tbody>
        </table>
        <fieldset>
          <legend>Mara’s position</legend>
          <label
            ><input
              type="radio"
              name="position"
              value="raft"
              checked
            />Raft</label
          >
          <label
            ><input type="radio" name="position" value="water" />Water</label
          >
        </fieldset>
        <label class="deal-choice"
          >Equipment
          <select id="deal">
            <option value="987">Wreck bell / Black-glass float</option>
            <option value="1575">Snatch block / Caulking iron</option>
            <option value="264">Tarred mitts / Galley kettle</option>
            <option value="2891">Breaker cask / Storm lantern</option>
            <option value="773">Hatch cover / Bone comb</option>
            <option value="1934">Sea anchor / Cork belt</option>
            <option value="601">Sounding line / Drift net</option>
            <option value="531">Sounding line / Boathook</option>
          </select>
        </label>
      </aside>
      <section class="table" aria-label="Equipment table">
        <div class="play-area" id="play-area">
          <button
            type="button"
            class="drop-surface"
            id="place-card"
            aria-label="Place selected card in Mara’s play"
            disabled
          ></button>
          <span class="water" aria-hidden="true"><i></i><i></i></span>
          <div id="played-face" aria-hidden="true"></div>
          <div class="play-note">
            <h2 id="play-label">Mara’s play</h2>
            <p id="receipt" role="status" aria-atomic="true"></p>
            <button id="reset" type="button" hidden>Try another play</button>
          </div>
        </div>
        <div id="cards" role="group" aria-label="Equipment cards"></div>
      </section>
    </main>
    <script type="module" src="./hand.ts"></script>
  </body>
</html>
