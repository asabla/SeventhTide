services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seventh_tide
      POSTGRES_USER: seventh_tide
      POSTGRES_PASSWORD: local-development
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - voyages:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seventh_tide -d seventh_tide"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  voyages:
