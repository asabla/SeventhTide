name: Game quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seventh_tide_test
          POSTGRES_PASSWORD: integration
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:ci
        env:
          TEST_DATABASE_URL: postgres://postgres:integration@127.0.0.1:${{ job.services.postgres.ports[5432] }}/seventh_tide_test
  tide-laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.10
          working_directory: verification/tide
      - run: mise -C verification/tide run verify
